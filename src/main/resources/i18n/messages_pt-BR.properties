# hprof-analyzer - textos em português (Brasil). Idioma padrão e fallback de chaves ausentes.
# Arquivo UTF-8. {0}, {1}... são argumentos posicionais.

# ---- CLI ----
cli.usage=Uso: hprof-analyzer <dump.hprof> [opções]\n\
\  --out <dir>             diretório de saída (padrão: .)\n\
\  --format html,md        formatos gerados (padrão: html,md)\n\
\  --top <n>               linhas por tabela (padrão: 50)\n\
\  --no-retained           pula dominator tree / retained sizes (mais rápido, menos memória)\n\
\  --leak-class a.B,c.D    classes cujas instâncias também terão caminho até GC root\n\
\  --app-package a.b,c.d  pacotes da aplicação no relatório -app (padrão: detecção automática)\n\
\  --i18n <código>        idioma do relatório e das mensagens (padrão: pt-BR; ex.: en)\n\
\  --version, -V           mostra a versão\n\
Dica: use -Xmx com ~1.5-2x o tamanho do dump.
