# ---- notas ----
note.sizes=Tamanhos = bytes dos registros hprof (campos/elementos, sem header de objeto). Referências weak/soft/phantom não retêm memória: objetos alcançáveis só por elas contam como não alcançáveis.
note.packages=Shallow somado por pacote (top 20 no gráfico).
note.dominators=Área = retained size; retângulos aninhados = objetos dominados. Clique para aproximar; breadcrumb para voltar.
note.paths=Maiores objetos (e --leak-class) com o menor caminho de referências fortes desde um GC root (Shark HeapAnalyzer). Arraste/zoom no grafo.
note.warnings=Problemas encontrados ao processar o dump. O relatório está incompleto: as seções abaixo podem estar vazias ou parciais.

