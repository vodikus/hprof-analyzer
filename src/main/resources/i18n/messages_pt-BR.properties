note.proxies=Proxies e subclasses criados em runtime (ByteBuddy, Hibernate, CGLIB/Spring, Mockito, Javassist, JDK Proxy), agrupados por gerador e classe base. Cada classe ocupa metaspace; o hprof não traz o tamanho do metaspace, só as classes e seus ClassLoaders.
note.proxiesTip=Sinal de classe recriada a cada uso em vez de cacheada. Gere uma vez e reutilize: guarde a Class gerada (ex. ByteBuddy TypeCache, Enhancer/ProxyFactory com cache), reutilize a instância de ByteBuddy/Enhancer e não crie um ClassLoader por chamada. Muitos loaders no grupo indicam ClassLoaders descartáveis que seguram classes no metaspace.
