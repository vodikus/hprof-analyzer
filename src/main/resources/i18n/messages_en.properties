# ---- notes ----
note.sizes=Sizes = bytes in hprof records (fields/elements, no object header). Weak/soft/phantom references do not retain memory: objects reachable only through them count as unreachable.
note.packages=Shallow size summed per package (top 20 in the chart).
note.dominators=Area = retained size; nested rectangles = dominated objects. Click to zoom in; use the breadcrumb to go back.
note.paths=Biggest objects (and --leak-class) with the shortest strong-reference path from a GC root (Shark HeapAnalyzer). Drag/zoom the graph.
note.warnings=Problems found while processing the dump. The report is incomplete: the sections below may be empty or partial.

