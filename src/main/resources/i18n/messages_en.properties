# ---- notes ----
note.sizes=Sizes estimated as the JVM lays objects out: 12 B header (arrays 16 B), 8 B alignment and 4 B references when compressed oops are on (the hprof writes them all with 8 B). Weak/soft/phantom references do not retain memory: objects reachable only through them count as unreachable.
note.packages=Shallow size summed per package (top 20 in the chart). A package's retained size includes objects of other packages it dominates: the values overlap and cannot be added up.
note.dominators=Area = retained size; nested rectangles = dominated objects. Click to zoom in; use the breadcrumb to go back.
note.paths=Biggest objects (and --leak-class) with the shortest strong-reference path from a GC root (Shark HeapAnalyzer). Drag/zoom the graph.
note.warnings=Problems found while processing the dump. The report is incomplete: the sections below may be empty or partial.

