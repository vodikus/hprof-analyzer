# ---- waste ----
log.waste=Waste, references and off-heap...
section.waste=Memory waste
note.waste=Memory allocated without useful data. Zeroed and duplicated arrays count only reachable objects (unreachable ones are garbage, not waste). Collections: exact JDK classes (HashSet shows up as its inner HashMap). Header/padding follow the size model in the summary (64-bit JVM with compressed class pointers); Class objects count by their hprof record size, outside that model, and the four parts add up to the total shallow size.
