note.proxies=Proxies and subclasses created at runtime (ByteBuddy, Hibernate, CGLIB/Spring, Mockito, Javassist, JDK Proxy), grouped by generator and base class. Each class takes metaspace; the hprof has no metaspace size, only the classes and their ClassLoaders.
note.proxiesTip=Sign of a class regenerated on every use instead of cached. Generate once and reuse: keep the generated Class (e.g. ByteBuddy TypeCache, Enhancer/ProxyFactory with caching), reuse the ByteBuddy/Enhancer instance and do not create a ClassLoader per call. Many loaders in a group point to throwaway ClassLoaders pinning classes in metaspace.
