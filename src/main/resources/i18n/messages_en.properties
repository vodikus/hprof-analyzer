# hprof-analyzer - English texts. UTF-8. {0}, {1}... are positional arguments.
# Missing keys fall back to messages_pt-BR.properties.

# ---- CLI ----
cli.usage=Usage: hprof-analyzer <dump.hprof> [options]\n\
\  --out <dir>             output directory (default: .)\n\
\  --format html,md,json   formats to generate (default: html,md; json = snapshot with the full histogram)\n\
\  --top <n>               rows per table (default: 50)\n\
\  --no-retained           skip dominator tree / retained sizes (faster, less memory)\n\
\  --leak-class a.B,c.D    classes whose instances also get a path to GC root\n\
\  --app-package a.b,c.d  application packages for the -app report (default: auto-detect)\n\
\  --i18n <code>          report and message language (default: pt-BR; e.g. en)\n\
\  --version, -V           print the version\n\
Tip: use -Xmx at ~1.5-2x the dump size.
