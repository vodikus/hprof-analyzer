section.concurrency=Concurrency
note.concurrency=Thread state from the threadStatus field (the hprof has no monitors), thread pools and queues, virtual threads, ThreadLocals and identical stacks. The "unbounded queue" column only describes the queue type (a newSingleThreadExecutor has one too); the dashboard rule counts only pools with max = Integer.MAX_VALUE and an unbounded queue, where max is never reached, and ignores ScheduledThreadPoolExecutor, where that is by design.
